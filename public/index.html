<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Corex Admin-Panel</title>
    <link class="tab-icon" rel="icon" href="./assets/logo.png" type="image/x-icon" sizes="any">
    <link rel="stylesheet" href="style.css">
    <script src="./app.js" defer></script>
</head>
<body>
    <nav class="navbar" id="navigation">
        <div class="navbar-left">
            <a class="ref-link" href="./dashboard.html"></a>
            <img class="nav-logo" src="./assets/logo.png" alt="logo">
            <h3 class="nav-logo-title">ADMIN PANEL</h3>
        </div>
        <div class="navbar-center">
            <a class href="#" class="nav-btn" id="auth-btn">
                <div>DASHBOARD</div>
            </a>
            <a class href="#" class="nav-btn" id="auth-btn">
                <div>SESSIONS</div>
            </a>
            <a class href="#" class="nav-btn" id="usage-btn">
                <div>USAGE</div>
            </a>
            <a class href="#" class="nav-btn" id="usage-btn">
                <div>ENDPOINTS</div>
            </a>
        </div>
        <div class="navbar-right">
            <div class="username-box">
                User: <span id="username-field">#User</span>
            </div>
            <a href="#">
                <img src="./assets/logout_icon.svg" alt="" id="logout-btn">
            </a>
        </div>
    </nav>

    <div class="main-box">
        <div class="left-box">
            <div class="activity-box">
    
            </div>
            <div class="horizontal-seprator-line"></div>
            <div class="services-box">

            </div>
        </div>

        <div class="vertical-seprator-line"></div>

        <div class="recent-view-box">
            <table class="recent-table-main">
                <thead>
                    <tr class="recent-table-head-row">
                        <th class="recent-table-client-id-col">CLIENT-ID</th>
                        <th class="recent-table-broker-col">BROKER</th>
                        <th class="recent-table-timestamp-col">TIMESTAMP</th>
                        <th class="recent-table-status-col">STATUS</th>
                        <th class="recent-table-response-col">RESPONSE</th>
                    </tr>
                </thead>
                <tbody>

                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
